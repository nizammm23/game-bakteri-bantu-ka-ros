<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archaea Quest: Interactive Labyrinth Learning Game</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{color-scheme:dark}
  body{background:radial-gradient(circle at 20% 20%,#0b2a3a 0,#050b18 55%,#02060f 100%);color:#e6fffb;font-family:system-ui,sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .glass{background:rgba(8,28,48,.7);border:1px solid rgba(45,212,191,.35);backdrop-filter:blur(6px);border-radius:16px;box-shadow:0 0 24px rgba(20,184,166,.12)}
  .neon{color:#5eead4;text-shadow:0 0 14px #14b8a6}
  input{background:#0a2236;border:1px solid #2dd4bf66;border-radius:10px;padding:8px 12px;color:#fff;width:100%}
  /* map nodes */
  .node{position:absolute;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:9999px;font-weight:800;background:#082032;border:3px solid var(--c,#5eead4);color:#fff;transition:transform .15s}
  .sm .node{width:40px;height:40px;font-size:12px}
  .node.open{animation:glow 2s infinite;cursor:pointer}.node.open:hover{transform:translate(-50%,-50%) scale(1.15)}
  .node.claimed{animation:pulse 1s infinite}.node.steal{border-color:#fb923c;background:#7c2d12;animation:pulse .8s infinite}
  .node.thrown{border-color:#fb923c;background:#431407;cursor:pointer}.node.fog{opacity:.3;border-style:dashed;filter:blur(1px)}.node.done{color:#000}.node.lost{opacity:.5;border-color:#52525b}
  @keyframes glow{50%{box-shadow:0 0 24px 8px var(--c)}}@keyframes pulse{50%{box-shadow:0 0 24px 10px #fb923c}}
  @keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}.pop{animation:pop .6s both}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}.conf{position:fixed;top:-20px;font-size:24px;animation:fall linear forwards;pointer-events:none;z-index:60}
  /* question panel: scan-in loading (pure CSS) */
  .qwrap{position:relative;overflow:hidden}
  .qscan{position:absolute;inset:0;z-index:5;background:#02121f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;animation:qs .8s forwards;pointer-events:none}
  .qscan i{width:34px;height:34px;border:3px solid #14b8a6;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes qs{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}@keyframes spin{to{transform:rotate(360deg)}}
  .qopts{animation:qo .85s both}@keyframes qo{0%,99%{pointer-events:none}100%{pointer-events:auto}}
  /* fullscreen neon loader */
  #loader{position:fixed;inset:0;z-index:100;background:#02060f;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;overflow:hidden}
  #loader.on{opacity:1;visibility:visible}
  #loader:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(45,212,191,.06) 0 2px,transparent 2px 5px);animation:scan 4s linear infinite}
  @keyframes scan{to{background-position:0 100px}}
  .ldbar{height:6px;width:240px;background:#0b2a3a;border-radius:9px;overflow:hidden;margin:14px auto 0}.ldbar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#14b8a6,#a78bfa,#f472b6);animation:fillbar var(--d,1.2s) ease-out forwards}
  @keyframes fillbar{to{width:100%}}
  .glitch{animation:gl 1.6s infinite}@keyframes gl{0%,90%,100%{text-shadow:0 0 14px #14b8a6}92%{text-shadow:3px 0 #f472b6,-3px 0 #38bdf8}96%{text-shadow:-3px 0 #f472b6,3px 0 #38bdf8}}
  .spin{animation:spin 6s linear infinite;transform-origin:50% 50%}.spin2{animation:spin 3.5s linear infinite reverse;transform-origin:50% 50%}
  /* leaderboard */
  .lbrow{position:absolute;left:0;right:0;transition:transform .6s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:12px;border:2px solid var(--c);background:rgba(8,28,48,.75)}
  .lbrow.up{animation:fup .9s}.lbrow.down{animation:fdn .9s}.lbrow.me{box-shadow:0 0 14px var(--c)}
  @keyframes fup{30%{background:rgba(16,185,129,.55)}}@keyframes fdn{30%{background:rgba(239,68,68,.55)}}
  .chip{position:absolute;right:10px;top:-6px;font-weight:900;animation:chip 1.6s forwards;pointer-events:none}
  @keyframes chip{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
  /* podium */
  .pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:190px}.pod>div{width:92px;border-radius:12px 12px 0 0;text-align:center;font-weight:800;padding-top:6px;transform-origin:bottom;animation:rise 1s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .trophy{animation:bounce 1.2s infinite}@keyframes bounce{50%{transform:translateY(-10px)}}
</style>

<body>
<div id="bg" class="fixed inset-0" style="z-index:0"></div>
<div id="app" class="relative max-w-6xl mx-auto p-3" style="z-index:1"></div>

<script>
/* =====================================================================
 * ARCHAEA QUEST ENGINE (subject-independent). Content lives in questions.js.
 * Modules: UI texts · Store (Firebase) · Loader · Leaderboard · Host logic · Views
 * ===================================================================== */
const Q = questionBank, $ = s => document.querySelector(s);
/* Optional tuning (add `settings:{...}` to questionBank to override) */
const C = Object.assign({ stealBonus: 5, wrongPenalty: 5, stealSeconds: 15, interludeSeconds: 8, loaderMs: 1500 }, Q.settings || {});
C.answerSeconds = Q.answerSeconds || 25; C.countdownSeconds = Q.countdownSeconds || 4;

/* ---------- Backward compatibility: accept older questions.js formats and fill in missing fields ---------- */
Q.groups = Q.groups || 6; Q.teacherPin = Q.teacherPin || "1234";
Q.groupIcons = Q.groupIcons || ["🦠", "🧬", "🔬", "🌋", "🧂", "🔥"];
Q.groupColors = Q.groupColors || ["#a78bfa", "#60a5fa", "#34d399", "#fbbf24", "#f87171", "#fb923c"];
Q.stages = Q.stages.map((s, i) => ({ ...s, count: s.count || s.reveal || 4, seconds: s.seconds || Q.timerSeconds || 60, label: s.label || { en: `STAGE ${i + 1}`, id: `TAHAP ${i + 1}` } }));   // old: reveal/timerSeconds
const stagePts = (st, k, pos) => st.points && st.points.length ? st.points[k % st.points.length] : Q.difficulties[Q.nodes[pos].d].points;   // no `points`? use each node's own difficulty
addEventListener("error", e => { const d = document.createElement("div"); d.className = "fixed bottom-2 left-2 right-2 z-[200] bg-red-900 text-xs p-2 rounded"; d.textContent = "⚠ " + e.message; document.body.appendChild(d); setTimeout(() => d.remove(), 9000); });

/* ---------- UI texts ---------- */
const UI = {
  en: { loginT:"Teacher / Host", loginS:"Student", pin:"Teacher PIN", roomOpt:"Room code (blank = new room)", roomIn:"Room code", wrongPin:"Wrong PIN", noRoom:"Room not found", yourName:"Your name", enter:"Enter",
    room:"ROOM", joinAt:"Students join with this code", lobby:"EXPEDITION PREP", members:"members", ready:"READY", waiting:"WAITING", startGame:"START GAME!", rename:"Rename group", save:"Save", imReady:"We're ready!", notReady:"Not ready",
    joinGroup:"Tap a group to join (solo play = a group of one)", unassigned:"Waiting to join", settings:"GAME SETTINGS", topic:"Topic", mode:"Mode", modeV:"Race + Quiz + Auto-steal", maze:"Stages", needGroup:"At least one group must have members", clearStu:"Remove all students",
    demo:"Demo mode: Firebase not configured, sync works only between tabs of this browser (see README).", waitT:"Waiting for the host to start...", beClicker:"I'll be the clicker", noClicker:"no clicker", youClicker:"👆 You are the CLICKER", youMember:"Discuss with your clicker",
    tapNode:"Tap a glowing point FAST!", discuss:"Discuss! Your clicker answers", stage:"Stage", nodes:"nodes", points:"pts", quiz:"ARCHAEA QUIZ - POINT", getReady:"GET READY!", watching:"Watching",
    correct:"Correct!", wrong:"Wrong!", timeout:"Time ran out!", passing:"Passing the question to other groups...", stealBanner:"STEAL!", stealSub:"missed it, answer first to steal", stealWin:"STEAL!", stealPts:"steal points",
    lb:"LEADERBOARD", answering:"answering", steals:"steals", feed:"LIVE ACTIVITY", answered:"Nodes done", accuracy:"Accuracy", stealsT:"Steals", stageEnd:"Stage complete", nextIn:"Next stage in", skip:"Skip", endNow:"End stage", toLobby:"Lobby", again:"Back to lobby", final:"Final Results", winner:"Winner", tie:"It's a tie!",
    group:"Group", host:"HOST MONITOR", s_ok:"answered", s_bad:"missed", s_to:"ran out of time on", s_st:"STOLE", n:"node",
    ld_boot:"BOOTING LAB", ld_enter:"ENTERING LAB", ld_tips:["Culturing archaea...","Sequencing 16S rRNA...","Aligning phylogeny...","Heating the vents...","Counting methanogens..."] },
  id: { loginT:"Guru / Host", loginS:"Siswa", pin:"PIN Guru", roomOpt:"Kode ruang (kosong = ruang baru)", roomIn:"Kode ruang", wrongPin:"PIN salah", noRoom:"Ruang tidak ditemukan", yourName:"Namamu", enter:"Masuk",
    room:"RUANG", joinAt:"Siswa bergabung dengan kode ini", lobby:"PERSIAPAN PENJELAJAHAN", members:"anggota", ready:"SIAP", waiting:"MENUNGGU", startGame:"MULAI GAME!", rename:"Ganti nama kelompok", save:"Simpan", imReady:"Kami siap!", notReady:"Belum siap",
    joinGroup:"Ketuk kelompok untuk bergabung (main sendiri = kelompok satu orang)", unassigned:"Menunggu bergabung", settings:"PENGATURAN PERMAINAN", topic:"Topik", mode:"Mode", modeV:"Balapan + Kuis + Curi otomatis", maze:"Tahap", needGroup:"Minimal satu kelompok harus punya anggota", clearStu:"Hapus semua siswa",
    demo:"Mode demo: Firebase belum diatur, sinkronisasi hanya antar tab di browser ini (lihat README).", waitT:"Menunggu host memulai...", beClicker:"Aku jadi clicker", noClicker:"belum ada clicker", youClicker:"👆 Kamu adalah CLICKER", youMember:"Diskusi dengan clicker-mu",
    tapNode:"Ketuk titik yang menyala CEPAT!", discuss:"Diskusikan! Clicker yang menjawab", stage:"Tahap", nodes:"titik", points:"poin", quiz:"KUIS ARCHAEA - TITIK", getReady:"BERSIAPLAH!", watching:"Menonton",
    correct:"Benar!", wrong:"Salah!", timeout:"Waktu habis!", passing:"Soal dilempar ke kelompok lain...", stealBanner:"CURI!", stealSub:"salah, jawab duluan untuk mencuri", stealWin:"CURIAN!", stealPts:"poin curian",
    lb:"PAPAN PERINGKAT", answering:"menjawab", steals:"curian", feed:"AKTIVITAS LANGSUNG", answered:"Titik selesai", accuracy:"Akurasi", stealsT:"Curian", stageEnd:"Tahap selesai", nextIn:"Tahap berikutnya dalam", skip:"Lewati", endNow:"Akhiri tahap", toLobby:"Lobi", again:"Kembali ke lobi", final:"Hasil Akhir", winner:"Pemenang", tie:"Seri!",
    group:"Kelompok", host:"MONITOR HOST", s_ok:"menjawab benar", s_bad:"salah di", s_to:"kehabisan waktu di", s_st:"MENCURI", n:"titik",
    ld_boot:"MENYALAKAN LAB", ld_enter:"MEMASUKI LAB", ld_tips:["Mengkultur archaea...","Mengurutkan 16S rRNA...","Menyelaraskan filogeni...","Memanaskan ventilasi...","Menghitung metanogen..."] }
};
let lang = "id";
const t = k => UI[lang][k], tr = o => o[lang], esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const qById = id => Q.questions.find(q => q.id === id);
const diffFor = pts => +Object.keys(Q.difficulties).find(d => Q.difficulties[d].points === pts) || 1;

/* ---------- Store: Firebase Realtime Database, or same-browser demo fallback ---------- */
const mem = {}, subs = [], fire = () => subs.forEach(f => f()), bc = "BroadcastChannel" in window ? new BroadcastChannel("aq") : null;
if (bc) bc.onmessage = e => { mem[e.data.path] = e.data.data; fire(); };
const Store = {
  fb: null, off: 0,
  async init() {
    try {
      if (typeof firebase !== "undefined" && firebaseConfig && firebaseConfig.databaseURL) {
        firebase.initializeApp(firebaseConfig); this.fb = firebase.database();
        this.fb.ref(".info/serverTimeOffset").on("value", s => this.off = s.val() || 0);   // same clock on every device
      }
    } catch (e) { console.warn("Firebase init failed", e); this.fb = null; }
  },
  now() { return Date.now() + this.off; },
  put(p, d) { if (this.fb) return this.fb.ref(p).set(d).catch(console.warn); mem[p] = d; bc && bc.postMessage({ path: p, data: d }); fire(); },
  tx(p, fn) { if (this.fb) return this.fb.ref(p).transaction(fn).catch(console.warn); const r = fn(mem[p] || null); if (r !== undefined) this.put(p, r); },
  once(p) { return this.fb ? this.fb.ref(p).once("value").then(s => s.val()) : Promise.resolve(mem[p] || null); },
  doc(p, cb) { if (this.fb) return this.fb.ref(p).on("value", s => cb(s.val())); subs.push(() => cb(mem[p] || null)); fire(); },
  col(p, cb) {
    if (this.fb) return this.fb.ref(p).on("value", s => { const v = s.val() || {}; cb(Object.keys(v).map(k => ({ id: k, ...v[k] }))); });
    subs.push(() => cb(Object.keys(mem).filter(k => k.startsWith(p + "/") && mem[k]).map(k => ({ id: k.slice(p.length + 1), ...mem[k] })))); fire();
  }
};
const now = () => Store.now();

/* ---------- Session state ---------- */
let role = null, me = null, room = null, G = { screen: "lobby" }, S = { used: new Set() }, P = [], GN = {}, Nd = {}, timer = null;
const R = p => `rooms/${room}/${p}`;
const gName = g => (GN[g] && GN[g].name) || `${t("group")} ${g + 1}`;
const members = g => P.filter(p => p.g === g);
const myGroup = () => { const p = P.find(p => p.id === me.pid); return p ? p.g : -1; };
const isClicker = g => g >= 0 && GN[g] && GN[g].clicker === me.pid;
const nkey = (k, st = G.stage) => `${G.run}_${st}_${k}`, nodeDoc = k => Nd[nkey(k)];
const running = () => G.screen === "play" && now() >= G.startAt && now() < G.endAt;
const claimsOf = () => (G.plan || []).map((p, k) => [k, nodeDoc(k)]).filter(([, d]) => d && d.st === "claimed");
const stealOpen = d => d && d.st === "thrown" && now() - d.thrownAt < C.stealSeconds * 1000;

function stats() {   // per-group score / steals / correct, derived from node docs (single source of truth)
  const s = Array.from({ length: Q.groups }, () => ({ score: 0, steals: 0, correct: 0 })); let tried = 0, done = 0, stl = 0;
  if (G.run) for (const id in Nd) if (id.startsWith(G.run + "_")) {
    const d = Nd[id]; tried += (d.tried || []).length;
    (d.pens || []).forEach(p => s[p.g].score -= p.amt);
    if (d.st === "done") { s[d.by].score += d.pts; s[d.by].correct++; done++; if (d.stolen) { s[d.by].steals++; stl++; } }
  }
  s.forEach(x => x.score = Math.max(0, x.score)); s.tot = { done, tried, stl }; return s;
}

/* ---------- Loader (neon-cyberpunk microbiology transitions) ---------- */
const Loader = {
  tm: 0,
  show(title, sub, ms = C.loaderMs) {
    const tips = t("ld_tips"), tip = sub || tips[Math.random() * tips.length | 0], el = $("#loader");
    el.innerHTML = `<div class="text-center"><svg width="150" height="150" viewBox="0 0 100 100" fill="none" stroke-linecap="round">
      <g class="spin" stroke="#2dd4bf">${[...Array(12)].map((_, i) => `<line x1="50" y1="14" x2="50" y2="6" transform="rotate(${i * 30} 50 50)"/>`).join("")}<circle cx="50" cy="50" r="30" stroke-width="3" fill="#06202c"/></g>
      <g class="spin2" stroke="#a78bfa" stroke-width="2"><path d="M30 50c10-18 30 18 40 0M30 58c10-18 30 18 40 0M30 42c10-18 30 18 40 0" stroke="#f472b6"/></g></svg>
      <div class="text-3xl font-black neon glitch mt-2 tracking-widest">${esc(title)}</div><div class="text-teal-200/80 text-sm mt-1">${esc(tip)}</div>
      <div class="ldbar" style="--d:${ms}ms"><b></b></div></div>`;
    el.classList.add("on"); clearTimeout(this.tm); this.tm = setTimeout(() => el.classList.remove("on"), ms);
  }
};

/* ---------- Leaderboard (animated: rank slide, count-up, +/- chips) ---------- */
const LB = {
  last: {}, rows: {}, h: 48,
  mount(el, h) { this.el = el; this.h = h; this.rows = {}; el.innerHTML = ""; el.style.position = "relative"; },
  update(list, mine = -1, busy = new Set()) {
    if (!this.el || !this.el.isConnected) return;
    this.el.style.height = list.length * this.h + "px";
    list.forEach((r, i) => {
      let o = this.rows[r.g];
      if (!o) { const e = document.createElement("div"); e.className = "lbrow"; e.style.setProperty("--c", Q.groupColors[r.g]); e.style.height = this.h - 6 + "px";
        e.innerHTML = `<b class="rk w-6 text-lg" style="color:${Q.groupColors[r.g]}"></b><span class="nm flex-1 truncate font-bold"></span><span class="bd text-[11px] text-amber-300"></span><b class="sc text-lg tabular-nums">0</b>`;
        this.el.appendChild(e); o = this.rows[r.g] = { e, rk: e.querySelector(".rk"), nm: e.querySelector(".nm"), bd: e.querySelector(".bd"), sc: e.querySelector(".sc") }; }
      o.e.style.transform = `translateY(${i * this.h}px)`; o.e.classList.toggle("me", r.g === mine);
      o.rk.textContent = i === 0 ? "👑" : i + 1; o.nm.textContent = `${Q.groupIcons[r.g]} ${gName(r.g)}`;
      o.bd.textContent = (busy.has(r.g) ? "✍ " : "") + (r.steals ? `🥷${r.steals}` : "");
      const prev = this.last[r.g] === undefined ? r.score : this.last[r.g];
      if (r.score !== prev) {
        const d = r.score - prev, c = document.createElement("span"); c.className = "chip " + (d > 0 ? "text-emerald-300" : "text-red-400"); c.textContent = (d > 0 ? "+" : "−") + Math.abs(d); o.e.appendChild(c); setTimeout(() => c.remove(), 1700);
        o.e.classList.remove("up", "down"); void o.e.offsetWidth; o.e.classList.add(d > 0 ? "up" : "down"); this.tween(o.sc, prev, r.score);
      } else if (!o.sc.dataset.v) o.sc.textContent = r.score;
      o.sc.dataset.v = r.score; this.last[r.g] = r.score;
    });
  },
  tween(el, a, b) { const t0 = performance.now(); (function f(n) { const k = Math.min(1, (n - t0) / 600); el.textContent = Math.round(a + (b - a) * k); if (k < 1) requestAnimationFrame(f); })(t0); }
};

/* ---------- Host logic (runs on the teacher's device only) ---------- */
function publish() { Store.put(R("game/state"), { json: JSON.stringify({ screen: G.screen, stage: G.stage, run: G.run, active: G.active, startAt: G.startAt, endAt: G.endAt, nextAt: G.nextAt, plan: G.plan }), v: Date.now() }); }
function setGroup(g, patch) { const c = GN[g] || {}; Store.put(R(`groups/g${g}`), { name: c.name || "", ready: !!c.ready, clicker: c.clicker || "", cname: c.cname || "", ...patch }); }
function toLobby() { G = { screen: "lobby" }; publish(); for (let g = 0; g < Q.groups; g++) setGroup(g, { ready: false }); go(); }
function clearStudents() { P.forEach(p => Store.put(R(`players/${p.id}`), null)); for (let g = 0; g < Q.groups; g++) Store.put(R(`groups/g${g}`), { name: "", ready: false, clicker: "", cname: "" }); }
function startGame() {
  const active = [...Array(Q.groups).keys()].filter(g => members(g).length); if (!active.length) return;
  active.forEach(g => { if (!members(g).some(p => p.id === (GN[g] || {}).clicker)) setGroup(g, { clicker: members(g)[0].id, cname: members(g)[0].name }); });
  Object.keys(Nd).forEach(id => Store.put(R(`nodes/${id}`), null)); LB.last = {};
  S.used = new Set(); G = { screen: "play", stage: 0, run: Date.now().toString(36), active }; startStage();
}

/* =====================================================================
 * LOGIKA STAGE & PEMILIHAN SOAL ACAK SESUAI DIFFICULTY (NO DUPLICATE)
 * ===================================================================== */

// 1. Pelacak ID soal agar tidak keulang
let usedQids = new Set();

function pickQuestionForStage(stageIdx, k) {
  // Jika di Stage 1 (Awal), reset daftar soal yang sudah terpakai
  if (stageIdx === 0 && k === 0) {
    usedQids.clear();
  }

  // Tentukan target difficulty sesuai stage
  let targetDiffs = [1];
  if (stageIdx === 0) targetDiffs = [1];                       // Stage 1: Easy
  else if (stageIdx === 1) targetDiffs = [1, 2];                // Stage 2: Easy-Medium
  else if (stageIdx === 2 || stageIdx === 3) targetDiffs = [2, 3, 4]; // Stage 3-4: Medium
  else if (stageIdx === 4 || stageIdx === 5) targetDiffs = [3, 4, 5]; // Stage 5-6: Hard
  else targetDiffs = [4, 5, 6];                                 // Stage 7-8: Duel Final

  // Filter pool berdasarkan difficulty
  let pool = Q.questions.filter(q => targetDiffs.includes(q.d));
  
  // Cari soal di pool yang BELUM pernah dipakai
  let unusedPool = pool.filter(q => !usedQids.has(q.id));

  // Jika pool target habis, cari dari seluruh bank soal yang belum dipakai
  if (!unusedPool.length) {
    unusedPool = Q.questions.filter(q => !usedQids.has(q.id));
  }

  // Jika semua 50 soal sudah pernah dipakai, fallback gunakan pool stage
  if (!unusedPool.length) {
    unusedPool = pool.length ? pool : Q.questions;
  }

  // Acak & ambil 1 soal
  const q = unusedPool[Math.floor(Math.random() * unusedPool.length)];
  usedQids.add(q.id); // Catat ID soal agar tidak muncul lagi
  return q;
}

/* ----- FUNGSI KONTROL STAGE ----- */
function startStage() {
  const st = Q.stages[G.stage], pos = st.pick || [...Array(st.count || st.reveal || 4).keys()];
  
  G.plan = pos.map((p, k) => { 
    const pts = (typeof stagePts === "function") ? stagePts(st, k, p) : 20; 
    const q = pickQuestionForStage(G.stage, k); 
    return { 
      pos: p, 
      pts: Q.difficulties[q.d] ? Q.difficulties[q.d].points : pts, 
      qid: q.id, 
      ord: Q.shuffleOptions ? [0, 1, 2, 3].sort(() => Math.random() - 0.5) : [0, 1, 2, 3] 
    }; 
  });

  G.screen = "play"; 
  G.startAt = now() + (C.countdownSeconds + 2) * 1000;

/* ---------- Player actions (atomic transactions on the node document) ---------- */
function claim(k) {
  const g = myGroup(); if (!isClicker(g) || !G.active.includes(g) || !running() || claimsOf().some(([, d]) => d.g === g)) return;
  Store.tx(R(`nodes/${nkey(k)}`), cur => {
    if (!cur) return { st: "claimed", g, pid: me.pid, ts: now(), tried: [], pts: G.plan[k].pts };
    if (cur.st === "thrown" && !(cur.tried || []).includes(g) && !stealOpen(cur)) return { ...cur, st: "claimed", g, pid: me.pid, ts: now() };
  });
}
function ans(k, opt) {   // clicker taps an option: own claim or steal attempt
  const g = myGroup(), d = nodeDoc(k); if (!d || !isClicker(g) || !G.active.includes(g) || !running()) return;
  if (d.st === "claimed" && d.g === g) settle(k, opt, "own"); else if (stealOpen(d) && !(d.tried || []).includes(g)) settle(k, opt, "steal");
}
function settle(k, opt, mode) {
  const p = G.plan[k], g = role === "student" ? myGroup() : -1;
  Store.tx(R(`nodes/${nkey(k)}`), cur => {
    if (!cur) return;
    const tried0 = cur.tried || [];
    if (mode === "own" && (cur.st !== "claimed" || (role === "student" && (cur.g !== g || cur.pid !== me.pid)))) return;
    if (mode === "steal" && (!stealOpen(cur) || tried0.includes(g))) return;
    const who = mode === "steal" ? g : cur.g, ok = opt !== null && p.ord[opt] === qById(p.qid).a, stolen = tried0.length > 0 || mode === "steal";
    if (ok) { const pts = p.pts + (stolen ? C.stealBonus : 0); return { ...cur, st: "done", by: who, g: who, pts, stolen, last: { g: who, ok: true, opt, rt: now(), pts, steal: stolen } }; }
    const tried = [...tried0, who], pens = mode === "own" && C.wrongPenalty ? [...(cur.pens || []), { g: who, amt: C.wrongPenalty }] : (cur.pens || []);
    const lost = tried.length >= G.active.length;
    return { ...cur, st: lost ? "lost" : "thrown", tried, pens, thrownAt: now(), last: { g: who, ok: false, opt, timeout: opt === null, rt: now(), steal: mode === "steal", pen: mode === "own" ? C.wrongPenalty : 0 } };
  });
}
const releaseStale = () => claimsOf().forEach(([k, d]) => { if (now() - d.ts > C.answerSeconds * 1000) settle(k, null, "own"); });

      ${L.ok ? `<div class="pop text-2xl font-extrabold">+${L.pts} ${t("points")}</div>` : `<div class="pop text-xl font-bold text-red-300">${L.pen ? "−" + L.pen + " " + t("points") : ""}</div>${L.steal ? "" : `<div class="text-sm text-amber-300 mt-1">🥷 ${t("passing")}</div>`}`}</div></div>`; }
  return `<div class="text-center text-sm my-2 ${p.clk ? "text-amber-300 font-bold" : "text-teal-100"}">${g < 0 ? "👀 " + t("watching") : p.clk ? t("tapNode") : t("youMember")}</div><div id="map">${mapHtml(p.clk, true)}</div>`;
}
function paneSwitch(force) {
  const p = paneNow(), el = $("#pane"); if (!el) return;
  if (p.key !== paneKey) { paneKey = p.key; el.innerHTML = paneHtml(p); }
  else if (p.kind === "m" && force) $("#map").innerHTML = mapHtml(p.clk, true);
}
function refreshS() {
  const g = myGroup(), s = stats(); paneSwitch(true);
  $("#hd").textContent = g >= 0 ? `${Q.groupIcons[g]} ${gName(g)} · ${s[g].score} ${t("points")}${isClicker(g) ? " 👆" : ""}` : "👀 " + t("watching");
  LB.update(lbList(), g, new Set(claimsOf().map(([, d]) => d.g))); tick();
}

/* ----- stage / final podium ----- */
B.end = () => {
  const final = G.screen === "final", l = lbList(), top = l.filter(x => x.score === l[0].score), order = [1, 0, 2].filter(i => l[i]), hs = { 0: 190, 1: 140, 2: 100 };
  $("#app").innerHTML = `<div class="flex justify-end">${langBtn()}</div><div class="text-center py-4 max-w-md mx-auto">
    <h2 class="text-3xl font-black neon">${final ? `<span class="trophy inline-block">🏆</span> ` + t("final") : t("stageEnd") + " " + (G.stage + 1)}</h2>
    ${final ? `<p class="text-xl mt-2 font-bold pop">${top.length > 1 ? t("tie") + " " : t("winner") + ": "}${top.map(x => esc(gName(x.g))).join(" & ")} 🎉</p>` : ""}
    <div class="pod mt-6">${order.map(i => `<div style="height:${hs[i]}px;background:${Q.groupColors[l[i].g]};color:#000;animation-delay:${(2 - i) * .25}s"><div class="text-2xl">${i === 0 ? "🥇" : i === 1 ? "🥈" : "🥉"}</div><div class="text-xs px-1 truncate">${Q.groupIcons[l[i].g]} ${esc(gName(l[i].g))}</div><div class="text-lg">${l[i].score}</div></div>`).join("")}</div>
    <div class="glass p-3 mt-4"><div id="lb"></div></div>
    ${final ? (role === "teacher" ? `<button onclick="toLobby()" class="mt-5 px-8 py-3 rounded-full bg-teal-400 text-black text-lg font-bold">${t("again")}</button>` : "")
      : `<div class="mt-4 text-teal-200">${t("nextIn")} <b id="nx" class="text-2xl"></b>s ${role === "teacher" ? `<button onclick="nextStage()" class="ml-3 px-3 py-1 rounded-full bg-teal-400 text-black text-sm font-bold">${t("skip")}</button>` : ""}</div>`}</div>`;
  LB.mount($("#lb"), 44); LB.update(l, role === "student" ? myGroup() : -1); confetti(final ? 60 : 18);
};
function confetti(n) { for (let i = 0; i < n; i++) { const c = document.createElement("div"); c.className = "conf"; c.textContent = ["🎉", "✨", "🦠", "🏆"][i % 4]; c.style.left = Math.random() * 100 + "vw"; c.style.animationDuration = 2 + Math.random() * 3 + "s"; document.body.appendChild(c); setTimeout(() => c.remove(), 5500); } }

/* ----- timer loop (all roles) ----- */
function startTick() { if (!timer) timer = setInterval(tick, 250); }
function tick() {
  const n = now();
  if (G.screen === "stageEnd") { const r = Math.max(0, Math.ceil((G.nextAt - n) / 1000)), e = $("#nx"); if (e) e.textContent = r; if (role === "teacher" && n >= G.nextAt) nextStage(); return; }
  if (G.screen !== "play") return;
  const rem = Math.max(0, Math.ceil((G.endAt - n) / 1000)), total = (G.endAt - G.startAt) / 1000, cdo = $("#cdo");
  if (cdo) { const w = G.startAt - n; cdo.style.display = w > 0 ? "flex" : "none"; if (w > 0) $("#cd").textContent = w > 3000 ? "⏳" : Math.ceil(w / 1000); }
  const bar = $("#tbar"), txt = $("#ttxt");
  if (bar) { bar.style.width = Math.max(0, (n < G.startAt ? total : (G.endAt - n) / 1000) / total * 100) + "%"; bar.style.background = rem < 15 ? "#ef4444" : rem < 30 ? "#f59e0b" : "#14b8a6"; }
  if (txt) txt.textContent = `${Math.floor(rem / 60)}:${String(rem % 60).padStart(2, "0")}`;
  if (role === "student") {
    paneSwitch(false); const g = myGroup(), own = claimsOf().find(([, d]) => d.g === g), a = $("#atxt"), s = $("#stxt"), sd = Object.values(Nd).find(d => stealOpen(d));
    if (a && own) a.textContent = Math.max(0, Math.ceil(C.answerSeconds - (n - own[1].ts) / 1000)) + "s";
    if (s && sd) s.textContent = Math.max(0, Math.ceil(C.stealSeconds - (n - sd.thrownAt) / 1000)) + "s";
    if (view === "play-student" && cdo && cdo.style.display === "none" && !$("#pane").dataset.go) { $("#pane").dataset.go = 1; refreshS(); }
  } else { releaseStale(); if (n >= G.endAt) endStage(); }
}
(async function boot() {
  Loader.show(t("ld_boot"), null, 1800); mazeBg(); await Store.init(); go();
})();
function mazeBg() {   // random maze behind everything (recursive backtracker)
  const W = 36, H = 20, vis = [...Array(H)].map(() => Array(W).fill(0)), Rr = [...Array(H)].map(() => Array(W).fill(1)), Bb = [...Array(H)].map(() => Array(W).fill(1)), st = [[0, 0]]; vis[0][0] = 1;
  while (st.length) {
    const [x, y] = st[st.length - 1], nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [x + dx, y + dy, dx, dy]).filter(([a, b]) => a >= 0 && b >= 0 && a < W && b < H && !vis[b][a]);
    if (!nb.length) { st.pop(); continue; }
    const [a, b, dx, dy] = nb[Math.random() * nb.length | 0]; vis[b][a] = 1; if (dx === 1) Rr[y][x] = 0; if (dx === -1) Rr[b][a] = 0; if (dy === 1) Bb[y][x] = 0; if (dy === -1) Bb[b][a] = 0; st.push([a, b]);
  }
  let d = ""; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { if (Rr[y][x]) d += `M${x + 1} ${y}v1`; if (Bb[y][x]) d += `M${x} ${y + 1}h1`; }
  $("#bg").innerHTML = `<svg class="w-full h-full" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><path d="${d}" stroke="#2dd4bf" stroke-opacity=".17" stroke-width=".07" fill="none"/></svg>`;
}
